<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Чат</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/7.12.1/polyfill.min.js"></script>
  <script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["\\$","\\$"]]},svg:{scale:1.2}};</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #f4f4f9; overflow: hidden; }
    .container { display: flex; width: 100%; height: 100vh; overflow: hidden; }
    .sidebar { width: 250px; background: #2c3e50; color: white; padding: 10px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .sidebar button { width: 100%; padding: 10px; margin-bottom: 10px; background: #3498db; color: white; border: none; cursor: pointer; }
    .sidebar button:hover { background: #2980b9; }
    #chat-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
    #chat-list li { display: flex; align-items: center; padding: 4px 0; cursor: pointer; }
    #chat-list li:hover { background: #34495e; }
    #chat-list li .chat-name { flex: 1; margin-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chat-list li .buttons-container { display: flex; align-items: center; gap: 5px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: white; display: flex; flex-direction: column; gap: 8px; }
    .input-area { display: flex; gap: 10px; padding: 10px; background: white; border-top: 1px solid #eee; }
    #user-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 16px; line-height: 1.4; max-height: 120px; min-height: 24px; }
    #send-btn { padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; min-width: 100px; }
    #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { max-width: 80%; padding: 12px; margin: 8px; border-radius: 8px; font-size: 16px; line-height: 1.4; }
    .message pre { background: #fff; border-radius: 6px; padding: 16px; overflow: auto; margin: 8px 0; border: 1px solid #e1e4e8; }
    .message code { font-family: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,Courier,monospace; font-size: 85%; padding: 0.2em 0.4em; background: rgba(97,102,106,0.05); border-radius: 3px; }
    .message pre code { background: transparent; padding: 0; font-size: 100%; word-break: normal; white-space: pre; border: 0; }
    .message-content { line-height: 1.4; font-size: 16px; }
    .user-message { background: #3498db; color: white; align-self: flex-end; margin-left: auto; white-space: pre-wrap; }
    .bot-message { background: #f0f0f0; color: black; align-self: flex-start; margin-right: auto; }
    .formula { display: block; font-family: monospace; white-space: pre-wrap; background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 5px 0; }
    img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 10px; }
    .icon-btn { background: none; border: none; color: white; cursor: pointer; padding: 5px; font-size: 16px; width: 24px; text-align: center; }
    .icon-btn:hover { color: #3498db; }
    .icon-btn.small { width: 18px; font-size: 14px; }
    .danger-btn { color: #e74c3c; }
    .danger-btn:hover { color: #c0392b !important; }
    #system-message { width: calc(100% - 20px); padding: 10px; border: 1px solid #ddd; border-radius: 5px; resize: none; overflow-y: hidden; max-height: 100px; margin-bottom: 10px; background: #ecf0f1; color: #2c3e50; }
    .token-info { margin-bottom: 10px; color: white; }
    .token-info > div { background: #34495e; padding: 8px; border-radius: 4px; margin-bottom: 5px; }
    #model-select { width: 100%; padding: 8px; margin-bottom: 10px; background: #34495e; color: white; border: 1px solid #3498db; }
    .error { background: #ffebee; border-left: 4px solid #ef5350; color: #c62828; padding: 12px; margin: 8px; border-radius: 4px; font-size: 14px; }
    .loading-dots { display: inline-block; position: relative; width: 60px; height: 8px; }
    .loading-dots div { position: absolute; top: 0; width: 8px; height: 8px; border-radius: 50%; background: #3498db; animation-timing-function: cubic-bezier(0,1,1,0); }
    .loading-dots div:nth-child(1) { left: 8px; animation: ld1 0.6s infinite; }
    .loading-dots div:nth-child(2) { left: 8px; animation: ld2 0.6s infinite; }
    .loading-dots div:nth-child(3) { left: 32px; animation: ld2 0.6s infinite; }
    .loading-dots div:nth-child(4) { left: 56px; animation: ld3 0.6s infinite; }
    @keyframes ld1 { 0%{transform:scale(0)} 100%{transform:scale(1)} }
    @keyframes ld3 { 0%{transform:scale(1)} 100%{transform:scale(0)} }
    @keyframes ld2 { 0%{transform:translate(0,0)} 100%{transform:translate(24px,0)} }
    #file-preview { display: none; flex-wrap: wrap; gap: 8px; padding: 8px; background: #f8f9fa; border-radius: 8px; margin: 0 10px; }
    #file-preview .chip { display: flex; align-items: center; gap: 6px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
    #file-preview .chip img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; margin: 0; }
    #file-preview .chip button { background: none; border: none; cursor: pointer; font-size: 16px; color: #999; padding: 0 2px; line-height: 1; }
    .sidebar-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sidebar-header h3 { flex: 1; margin: 0; font-size: 16px; }
    .sidebar-header a { color: #95a5a6; font-size: 16px; text-decoration: none; }
    .sidebar-header a:hover { color: #3498db; }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; max-height: 40vh; }
      .chat-area { height: 60vh; }
      #chat-window { max-height: calc(60vh - 120px); }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>AI Чат</h3>
        <a href="/settings" title="Налаштування"><i class="fas fa-cog"></i></a>
        <a href="/" title="Сервіси"><i class="fas fa-th-large"></i></a>
      </div>
      <select id="model-select"></select>
      <div class="token-info">
        <div><label>Message Size (tokens):</label> <span id="token-count" style="font-family:monospace">0</span></div>
      </div>
      <button id="new-chat">Новий чат</button>
      <textarea id="system-message" placeholder="Системний промпт..."></textarea>
      <ul id="chat-list"></ul>
    </div>
    <div class="chat-area">
      <div id="chat-window"></div>
      <div id="file-preview"></div>
      <div class="input-area">
        <input type="file" id="file-input" multiple accept="image/*,.txt,.md,.csv" style="display:none">
        <button id="file-btn" type="button" title="Прикріпити файл" style="background:none;border:none;cursor:pointer;font-size:20px;color:#3498db;padding:8px"><i class="fas fa-paperclip"></i></button>
        <textarea id="user-input" placeholder="Введіть ваш запит..."></textarea>
        <button id="send-btn">Надіслати</button>
      </div>
    </div>
  </div>

  <template id="loading-indicator">
    <div class="loading-dots"><div></div><div></div><div></div><div></div></div>
  </template>

  <script>
    const settings = {{ settings | tojson }};
    const selectedModel = {{ selected_model | tojson }};

    let chats = [];
    let currentChatId = null;
    let sessionFiles = [];

    // ========== Token counting ==========
    function countTokens(messages) {
      let total = 0;
      const perMsg = 3, perName = 1;
      for (const msg of messages) {
        total += perMsg;
        let content = typeof msg.content === 'string' ? msg.content : '';
        total += Math.ceil(content.length / 4);
        if (msg.name) total += perName;
      }
      return total;
    }

    function updateTokenDisplay(context) {
      document.getElementById('token-count').textContent = countTokens(context);
    }

    // ========== Model selector ==========
    function populateModelSelect(settings, selectedModel) {
      const select = document.getElementById('model-select');
      select.innerHTML = '';
      let hasSelected = false;
      for (const provider of settings.providers) {
        const group = document.createElement('optgroup');
        group.label = provider.name;
        for (const model of provider.models) {
          const opt = document.createElement('option');
          const val = provider.id + '::' + model.apiModel;
          opt.value = val;
          opt.textContent = provider.name + ' - ' + model.apiModel;
          if (val === selectedModel) {
            opt.selected = true;
            hasSelected = true;
          }
          group.appendChild(opt);
        }
        select.appendChild(group);
      }
      if (!hasSelected && select.options.length > 0) {
        select.options[0].selected = true;
      }
    }

    function getActiveProviderAndModel(settings) {
      const v = document.getElementById('model-select').value;
      const [pid, mid] = v.split('::');
      const provider = settings.providers.find(p => p.id === pid);
      const model = provider ? provider.models.find(m => m.apiModel === mid) : null;
      return { provider, model };
    }

    // ========== Chats API ==========
    async function loadChats() {
      try {
        const resp = await fetch('/ai-chat/api/chats');
        const data = await resp.json();
        chats = data.chats || [];
        renderChatList();
        if (chats.length === 0) { createNewChat(); }
        else if (currentChatId !== null) {
          const exists = chats.find(c => c.id === currentChatId);
          if (exists) selectChat(currentChatId);
        }
      } catch(e) { console.error('Failed to load chats:', e); }
    }

    async function createNewChat(name) {
      try {
        const resp = await fetch('/ai-chat/api/chats', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name: name || null })
        });
        const chat = await resp.json();
        chats.unshift(chat);
        selectChat(chat.id);
        renderChatList();
      } catch(e) { console.error('Failed to create chat:', e); }
    }

    async function selectChat(chatId) {
      currentChatId = chatId;
      try {
        const resp = await fetch('/ai-chat/api/chats/' + chatId);
        const chat = await resp.json();
        const idx = chats.findIndex(c => c.id === chatId);
        if (idx >= 0) chats[idx] = chat;
        renderChatWindow(chat);
        renderChatList();
        document.getElementById('system-message').value = chat.system_message || '';
        updateTokenDisplayForChat(chat);
      } catch(e) { console.error('Failed to load chat:', e); }
    }

    function renderChatWindow(chat) {
      const w = document.getElementById('chat-window');
      w.innerHTML = '';
      for (const msg of chat.messages) {
        if (msg.type === 'formula') appendMessage(w, msg.sender, msg.text, 'formula');
        else if (msg.type === 'image') appendMessage(w, msg.sender, msg.text, 'image');
        else appendMessage(w, msg.sender, msg.text);
      }
    }

    function updateTokenDisplayForChat(chat) {
      const context = [];
      if (chat.system_message) context.push({ role: 'system', content: chat.system_message });
      for (const m of chat.messages) context.push({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text });
      updateTokenDisplay(context);
    }

    // ========== Chat list ==========
    function renderChatList() {
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      chats.forEach((chat, index) => {
        const li = document.createElement('li');
        if (chat.id === currentChatId) li.style.backgroundColor = '#34495e';
        li.addEventListener('click', () => selectChat(chat.id));

        const name = document.createElement('span');
        name.className = 'chat-name';
        name.textContent = chat.name || 'Чат ' + (index + 1);
        li.appendChild(name);

        const btns = document.createElement('div');
        btns.className = 'buttons-container';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'icon-btn';
        renameBtn.innerHTML = '<i class="fas fa-edit"></i>';
        renameBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const newName = prompt('Введіть нову назву чату:');
          if (newName) {
            await fetch('/ai-chat/api/chats/' + chat.id, {
              method: 'PUT',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ name: newName })
            });
            chat.name = newName;
            renderChatList();
          }
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'icon-btn';
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
        deleteBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('Видалити чат?')) return;
          await fetch('/ai-chat/api/chats/' + chat.id, { method: 'DELETE' });
          const idx = chats.indexOf(chat);
          chats.splice(idx, 1);
          if (currentChatId === chat.id) {
            currentChatId = null;
            document.getElementById('chat-window').innerHTML = '';
          }
          renderChatList();
          if (chats.length === 0) createNewChat();
        });

        btns.appendChild(renameBtn);
        btns.appendChild(deleteBtn);
        li.appendChild(btns);
        list.appendChild(li);
      });
    }

    // ========== Messages ==========
    function appendMessage(w, sender, text, type) {
      const div = document.createElement('div');
      div.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      if (sender === 'user' && type !== 'file') {
        div.textContent = text;
        w.appendChild(div);
        w.scrollTop = w.scrollHeight;
        return;
      }
      if (type === 'formula') {
        const fd = document.createElement('div');
        fd.className = 'formula';
        fd.textContent = text.replace(/\\\\/g, '\\');
        div.appendChild(fd);
        w.appendChild(div);
        w.scrollTop = w.scrollHeight;
        if (sender === 'bot') setTimeout(() => { MathJax.typesetPromise([fd]).catch(()=>{}); }, 10);
        return;
      }
      if (type === 'image') {
        const c = document.createElement('div');
        c.style.cssText = 'position:relative;display:inline-block';
        const img = document.createElement('img');
        img.src = text;
        img.alt = 'Зображення';
        const dl = document.createElement('a');
        dl.href = text; dl.download = 'image';
        dl.className = 'icon-btn';
        dl.title = 'Завантажити';
        dl.innerHTML = '<i class="fas fa-download"></i>';
        dl.style.cssText = 'position:absolute;top:14px;right:4px;background:rgba(0,0,0,0.5);border-radius:4px;padding:4px 6px;color:white;text-decoration:none;font-size:14px;';
        c.appendChild(img); c.appendChild(dl);
        div.appendChild(c);
      } else {
        const cd = document.createElement('div');
        cd.className = 'message-content';
        cd.innerHTML = DOMPurify.sanitize(marked.parse(text));
        div.appendChild(cd);
      }
      w.appendChild(div);
      w.scrollTop = w.scrollHeight;
      setTimeout(() => {
        if (typeof Prism !== 'undefined') Prism.highlightAllUnder(div);
        addCopyButtons(w);
      }, 0);
    }

    function addCopyButtons(w) {
      w.querySelectorAll('pre > code').forEach(code => {
        if (code.parentElement.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'icon-btn copy-btn';
        btn.title = 'Copy code';
        btn.innerHTML = "<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 48 48'><rect x='8' y='8' width='28' height='32' rx='4' fill='none' stroke='white' stroke-width='3'/><rect x='12' y='4' width='28' height='32' rx='4' fill='none' stroke='white' stroke-width='3'/></svg>";
        btn.style.cssText = 'position:absolute;top:6px;right:6px;background:transparent;border:none;padding:0;cursor:pointer;z-index:10';
        const pre = code.parentElement;
        pre.style.position = 'relative';
        pre.appendChild(btn);
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(code.innerText).then(() => {
            btn.title = 'Copied!';
            setTimeout(() => { btn.title = 'Copy code'; }, 1200);
          });
        });
      });
    }

    // ========== Loading / Error ==========
    function showLoading() {
      document.getElementById('send-btn').disabled = true;
      document.getElementById('user-input').disabled = true;
      document.getElementById('model-select').disabled = true;
      const tpl = document.getElementById('loading-indicator');
      if (tpl) {
        const clone = tpl.content.cloneNode(true);
        const wrapper = document.createElement('div');
        wrapper.className = 'message bot-message';
        wrapper.id = 'loading-indicator-msg';
        wrapper.appendChild(clone);
        document.getElementById('chat-window').appendChild(wrapper);
      }
    }

    function hideLoading() {
      document.getElementById('send-btn').disabled = false;
      document.getElementById('user-input').disabled = false;
      document.getElementById('model-select').disabled = false;
      const el = document.getElementById('loading-indicator-msg');
      if (el) el.remove();
    }

    function showError(msg) {
      const w = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'message bot-message error';
      div.textContent = 'Error: ' + msg;
      w.appendChild(div);
      w.scrollTop = w.scrollHeight;
      setTimeout(() => { if (div.parentNode) div.remove(); }, 5000);
    }

    // ========== File handlers ==========
    const SUPPORTED_IMAGE_TYPES = ['image/jpeg','image/png','image/gif','image/webp'];
    const SUPPORTED_TEXT_TYPES = ['text/plain','text/markdown','text/csv','text/html'];

    function getFileCategory(file) {
      if (SUPPORTED_IMAGE_TYPES.includes(file.type)) return 'image';
      const ext = file.name.split('.').pop().toLowerCase();
      if (['jpg','jpeg','png','gif','webp'].includes(ext)) return 'image';
      if (['txt','md','csv','html'].includes(ext)) return 'text';
      return null;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('Помилка читання файлу: ' + file.name));
        r.readAsDataURL(file);
      });
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('Помилка читання файлу: ' + file.name));
        r.readAsText(file, 'UTF-8');
      });
    }

    function renderFilePreview() {
      const c = document.getElementById('file-preview');
      c.innerHTML = '';
      if (sessionFiles.length === 0) { c.style.display = 'none'; return; }
      c.style.display = 'flex';
      sessionFiles.forEach((file, idx) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        if (file.category === 'image') {
          const img = document.createElement('img');
          img.src = file.dataUrl;
          chip.appendChild(img);
        } else {
          const icon = document.createElement('i');
          icon.className = 'fas fa-file-alt';
          icon.style.color = '#3498db';
          chip.appendChild(icon);
        }
        const name = document.createElement('span');
        name.textContent = file.name.length > 18 ? file.name.substring(0,15)+'...' : file.name;
        chip.appendChild(name);
        const rm = document.createElement('button');
        rm.innerHTML = '&times;';
        rm.addEventListener('click', () => { sessionFiles.splice(idx, 1); renderFilePreview(); });
        chip.appendChild(rm);
        c.appendChild(chip);
      });
    }

    async function handleFileSelect(event) {
      for (const file of event.target.files) {
        const category = getFileCategory(file);
        if (!category) continue;
        const fd = { name: file.name, type: file.type, category };
        if (category === 'image') fd.dataUrl = await readFileAsDataURL(file);
        else if (category === 'text') fd.textContent = await readFileAsText(file);
        sessionFiles.push(fd);
      }
      event.target.value = '';
      renderFilePreview();
    }

    // ========== Send message ==========
    async function sendMessage() {
      const text = document.getElementById('user-input').value.trim();
      if (!text && sessionFiles.length === 0) return;

      if (!currentChatId) {
        await createNewChat();
        setTimeout(() => sendMessage(), 100);
        return;
      }

      document.getElementById('user-input').value = '';
      autoResizeTextarea(document.getElementById('user-input'));

      let displayText = text;
      const fileNames = sessionFiles.map(f => f.name);
      if (fileNames.length > 0) displayText = text ? text + '\n\n[Файли: ' + fileNames.join(', ') + ']' : '[Файли: ' + fileNames.join(', ') + ']';

      const chatWindow = document.getElementById('chat-window');
      appendMessage(chatWindow, 'user', displayText);

      showLoading();

      try {
        // Upload files first
        const fileIds = [];
        for (const file of sessionFiles) {
          const blob = file.category === 'image' ? dataURLtoBlob(file.dataUrl) : new Blob([file.textContent], {type: 'text/plain'});
          const formData = new FormData();
          formData.append('file', blob, file.name);
          formData.append('chat_id', currentChatId);
          const resp = await fetch('/ai-chat/api/upload', { method: 'POST', body: formData });
          const data = await resp.json();
          if (data.file_id) fileIds.push(data.file_id);
        }

        const resp = await fetch('/ai-chat/api/chats/' + currentChatId + '/messages', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text, file_ids: fileIds })
        });
        const result = await resp.json();

        if (result.error) {
          showError(result.error);
        } else {
          if (result.response.includes('formula:')) {
            const formula = result.response.replace('formula:','').trim();
            appendMessage(chatWindow, 'bot', formula, 'formula');
          } else if (result.response.includes('image:')) {
            const imgUrl = result.response.replace('image:','').trim();
            appendMessage(chatWindow, 'bot', imgUrl, 'image');
          } else {
            appendMessage(chatWindow, 'bot', result.response);
          }
        }

        sessionFiles = [];
        renderFilePreview();
      } catch(e) {
        showError(e.message);
      } finally {
        hideLoading();
      }
    }

    function dataURLtoBlob(dataURL) {
      const parts = dataURL.split(',');
      const mime = parts[0].match(/:(.*?);/)[1];
      const bstr = atob(parts[1]);
      const n = bstr.length;
      const u8arr = new Uint8Array(n);
      for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
      return new Blob([u8arr], { type: mime });
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, el.id === 'system-message' ? 100 : 60) + 'px';
    }

    // ========== System message ==========
    async function saveSystemMessage() {
      if (currentChatId) {
        const val = document.getElementById('system-message').value;
        await fetch('/ai-chat/api/chats/' + currentChatId, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ system_message: val })
        });
      }
    }

    // ========== Init ==========
    document.addEventListener('DOMContentLoaded', () => {
      marked.setOptions({ breaks: true });
      populateModelSelect(settings, selectedModel);

      document.getElementById('new-chat').addEventListener('click', () => createNewChat());
      document.getElementById('send-btn').addEventListener('click', sendMessage);
      document.getElementById('user-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
      document.getElementById('user-input').addEventListener('input', () => autoResizeTextarea(document.getElementById('user-input')));
      document.getElementById('system-message').addEventListener('input', () => {
        autoResizeTextarea(document.getElementById('system-message'));
        saveSystemMessage();
      });
      document.getElementById('file-input').addEventListener('change', handleFileSelect);
      document.getElementById('file-btn').addEventListener('click', () => document.getElementById('file-input').click());
      document.getElementById('model-select').addEventListener('change', async () => {
        const val = document.getElementById('model-select').value;
        try {
          await fetch('/ai-chat/api/model-settings', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ selectedModel: val })
          });
        } catch(e) { console.error('Failed to save model selection:', e); }
      });

      autoResizeTextarea(document.getElementById('user-input'));
      autoResizeTextarea(document.getElementById('system-message'));
      loadChats();
    });
  </script>
</body>
</html>
