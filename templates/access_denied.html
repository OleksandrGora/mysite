<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Доступ заборонено</title>
    <meta http-equiv="refresh" content="3;url=/login">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .box {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { margin: 0 0 8px; color: #333; }
        p { color: #666; margin: 0 0 4px; }
        .email { font-weight: bold; color: #333; }
        .timer { color: #999; font-size: 14px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔒</div>
        <h2>Доступ заборонено</h2>
        <p>Акаунт <span class="email">{{ email }}</span></p>
        <p>не має доступу до цього сайту.</p>
        <p class="timer">Перенаправлення через <span id="t">3</span> сек...</p>
    </div>
    <script>
        let t = 3;
        setInterval(() => {
            t--;
            document.getElementById('t').textContent = t;
        }, 1000);
    </script>
</body>
</html>
